[package]
name = "xitca-postgres-toasty"
version = "0.1.0"
edition = "2024"

[dependencies]
xitca-postgres = { version = "0.3", features = ["compat"] }

anyhow = "1"
postgres-types = "0.2"
toasty-core = "0.1.0"
toasty-sql = "0.1"
tokio = { version = "1", default-features = false }

[dev-dependencies]
toasty = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }

[patch.crates-io]
xitca-postgres = { git = "http://github.com/HFQR/xitca-web", rev = "ec74abb" }

toasty = { git = "http://github.com/tokio-rs/toasty" }
toasty-core = { git = "http://github.com/tokio-rs/toasty" }
toasty-sql = { git = "http://github.com/tokio-rs/toasty" }
