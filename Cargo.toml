[package]
name = "xitca-postgres-toasty"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
bigdecimal = ["dep:bigdecimal", "toasty-core/bigdecimal"]
jiff = ["dep:jiff", "toasty-core/jiff", "postgres-types/with-jiff-0_2"]
rust_decimal = ["dep:rust_decimal", "toasty-core/rust_decimal"]
tls = ["xitca-postgres/tls"]

nightly = ["xitca-postgres/nightly"]

[[test]]
name = "toasty_integration"
path = "tests/toasty_integration.rs"
required-features = ["rust_decimal"]

[[example]]
name = "hello"
path = "examples/hello/src/main.rs"

[dependencies]
async-stream = "0.3.6"
futures-core = { version = "0.3.31", default-features = false }
postgres-types = { version = "0.2", features = ["with-uuid-1"] }
toasty-core = { version = "0.1.0", features = ["assert-struct"] }
toasty-sql = "0.1"
tokio = { version = "1", default-features = false }
uuid = { version = "1", default-features = false }
xitca-postgres = { version = "0.4" }

bigdecimal = { version = "0.4.9", optional = true }
jiff = { version = "0.2.16", optional = true }
rust_decimal = { version = "1", features = ["db-postgres"], optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false }
toasty = "0.1"
toasty-driver-integration-suite = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }

[patch.crates-io]
toasty = { git = "http://github.com/fakeshadow/toasty", branch = "engine" }
toasty-core = { git = "http://github.com/fakeshadow/toasty", branch = "engine" }
toasty-sql = { git = "http://github.com/fakeshadow/toasty", branch = "engine" }
toasty-driver-integration-suite = { git = "http://github.com/fakeshadow/toasty", branch = "engine" }
xitca-postgres = { git = "https://github.com/HFQR/xitca-web" }
